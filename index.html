<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JSON Field Editor</title>
    <!-- Removed Tailwind CSS -->
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Highlight.js for syntax highlighting -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    
    <!-- Sortable.js for drag-and-drop -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.0/Sortable.min.js"></script>
    
    <!-- JSON Schema Validator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ajv/8.12.0/ajv.min.js"></script>
    
    <style>
        /* Base Styles */
        :root {
            --color-white: #ffffff;
            --color-black: #000000;
            --color-blue-50: #eff6ff;
            --color-blue-100: #dbeafe;
            --color-blue-400: #60a5fa;
            --color-blue-500: #3b82f6;
            --color-blue-600: #2563eb;
            --color-blue-700: #1d4ed8;
            --color-blue-900: #1e3a8a;
            --color-gray-50: #f9fafb;
            --color-gray-100: #f3f4f6;
            --color-gray-200: #e5e7eb;
            --color-gray-300: #d1d5db;
            --color-gray-400: #9ca3af;
            --color-gray-500: #6b7280;
            --color-gray-600: #4b5563;
            --color-gray-700: #374151;
            --color-gray-800: #1f2937;
            --color-gray-900: #111827;
            --color-red-50: #fef2f2;
            --color-red-500: #ef4444;
            --color-red-600: #dc2626;
            --color-green-50: #f0fdf4;
            --color-green-100: #dcfce7;
            --color-green-500: #22c55e;
            --color-green-600: #16a34a;
            --color-purple-600: #9333ea;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
            --transition-all: all 0.2s ease;
        }

        /* Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Typography */
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            line-height: 1.5;
            color: var(--color-gray-700);
        }

        /* Base Layout */
        body {
            min-height: 100vh;
            background: linear-gradient(to bottom right, var(--color-gray-50), var(--color-gray-100));
            padding: 1.5rem;
            transition: var(--transition-all);
        }

        .container {
            max-width: 80rem;
            margin: 0 auto;
        }

        .space-y-6 > * + * {
            margin-top: 1.5rem;
        }

        /* Components */
        .card {
            background-color: rgba(255, 255, 255, 0.8);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border-radius: 1rem;
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--color-gray-100);
        }

        .header-card {
            text-align: center;
            padding: 1.5rem;
            position: relative;
        }

        .input-card {
            padding: 1.5rem;
        }

        .main-card {
            overflow: hidden;
        }

        /* Headers */
        .header {
            font-size: 2.25rem;
            font-weight: 700;
            background: linear-gradient(to right, var(--color-blue-600), var(--color-purple-600));
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .header-description {
            color: var(--color-gray-600);
            margin-top: 0.5rem;
        }

        /* Flex and Grid */
        .flex {
            display: flex;
        }

        .flex-1 {
            flex: 1;
        }

        .flex-col {
            flex-direction: column;
        }

        .items-center {
            align-items: center;
        }

        .justify-center {
            justify-content: center;
        }

        .justify-between {
            justify-content: space-between;
        }

        .space-x-1 > * + * {
            margin-left: 0.25rem;
        }

        .space-x-2 > * + * {
            margin-left: 0.5rem;
        }

        .space-x-3 > * + * {
            margin-left: 0.75rem;
        }

        .space-x-4 > * + * {
            margin-left: 1rem;
        }

        .grid {
            display: grid;
        }

        .grid-cols-2 {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .divide-x > * + * {
            border-left: 1px solid var(--color-gray-100);
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            padding: 0.375rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            cursor: pointer;
            transition: var(--transition-all);
            transform: scale(1);
            border: none;
            outline: none;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn i {
            width: 1rem;
            height: 1rem;
            margin-right: 0.375rem;
        }

        .btn-default {
            background-color: var(--color-gray-100);
            color: var(--color-gray-700);
        }

        .btn-default:hover {
            background-color: var(--color-gray-200);
        }

        .btn-primary {
            background-color: var(--color-blue-500);
            color: var(--color-white);
        }

        .btn-primary:hover {
            background-color: var(--color-blue-600);
            box-shadow: var(--shadow-md);
        }

        .btn-success {
            background-color: var(--color-green-500);
            color: var(--color-white);
        }

        .btn-success:hover {
            background-color: var(--color-green-600);
        }

        .btn-danger {
            background-color: var(--color-red-500);
            color: var(--color-white);
        }

        .btn-danger:hover {
            background-color: var(--color-red-600);
        }

        .btn-disabled {
            background-color: var(--color-gray-100);
            color: var(--color-gray-400);
            cursor: not-allowed;
        }

        /* Form Controls */
        .input {
            width: 100%;
            padding: 1rem;
            background-color: rgba(249, 250, 251, 0.5);
            border: 0;
            border-radius: 0.75rem;
            font-family: monospace;
            font-size: 0.875rem;
            resize: none;
            transition: var(--transition-all);
        }

        .input:focus {
            outline: none;
            box-shadow: 0 0 0 2px var(--color-blue-500);
        }

        .search-input {
            position: relative;
        }

        .search-input input {
            width: 12rem;
            padding: 0.375rem 0.75rem;
            padding-left: 2rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            background-color: var(--color-gray-50);
            border: 0;
            outline: none;
        }

        .search-input input:focus {
            box-shadow: 0 0 0 2px var(--color-blue-500);
        }

        .search-input i {
            position: absolute;
            left: 0.625rem;
            top: 50%;
            transform: translateY(-50%);
            width: 1rem;
            height: 1rem;
            color: var(--color-gray-400);
        }

        /* Lists and Items */
        .field-list-container {
            background-color: rgba(249, 250, 251, 0.5);
            border-radius: 0.75rem;
            padding: 0.5rem;
        }

        .field-list {
            max-height: calc(100vh - 600px);
            overflow-y: auto;
        }

        .field-item {
            position: relative;
            display: flex;
            align-items: center;
            padding: 0.5rem 0.75rem;
            margin: 0.25rem 0;
            border-radius: 0.5rem;
            cursor: pointer;
            transition: var(--transition-all);
        }

        .field-item:hover {
            background-color: var(--color-white);
            box-shadow: var(--shadow-sm);
        }

        .field-item.selected {
            background-color: var(--color-blue-50);
        }

        .field-item.selected:hover {
            background-color: var(--color-blue-100);
        }

        .field-checkbox {
            margin-right: 0.5rem;
            width: 1rem;
            height: 1rem;
            border-radius: 0.25rem;
            border: 1px solid var(--color-gray-300);
            display: flex;
            align-items: center;
            justify-content: center;
            transition: var(--transition-all);
        }

        .field-item.selected .field-checkbox {
            background-color: var(--color-blue-500);
            border-color: var(--color-blue-500);
        }

        .field-content {
            flex: 1;
            font-family: monospace;
            font-size: 0.875rem;
            color: var(--color-gray-700);
            display: flex;
            align-items: center;
        }

        .field-chevron {
            display: inline-block;
            width: 0.75rem;
            height: 0.75rem;
            margin: 0 0.25rem;
            color: var(--color-gray-400);
        }

        .field-name {
            color: var(--color-gray-700);
        }

        .field-name.last {
            color: var(--color-blue-600);
        }

        /* Type indicators */
        .type-indicator {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 500;
            margin-left: 8px;
        }

        .type-string { background: #e8f5e9; color: #2e7d32; }
        .type-number { background: #e3f2fd; color: #1565c0; }
        .type-boolean { background: #fff3e0; color: #ef6c00; }
        .type-object { background: #f3e5f5; color: #7b1fa2; }
        .type-array { background: #fce4ec; color: #c2185b; }
        .type-null { background: #fafafa; color: #616161; }

        /* JSON Preview */
        .preview-container {
            position: relative;
        }

        .preview-label {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
            font-size: 0.75rem;
            color: var(--color-gray-500);
            background-color: rgba(255, 255, 255, 0.8);
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
        }

        .preview-content {
            background-color: rgba(249, 250, 251, 0.5);
            border-radius: 0.75rem;
            padding: 1rem;
            max-height: calc(100vh - 600px);
            overflow: auto;
        }

        /* Breadcrumbs */
        .breadcrumbs {
            padding: 0.5rem 1.5rem;
            border-bottom: 1px solid var(--color-gray-100);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.875rem;
            color: var(--color-gray-600);
        }

        .breadcrumb-items {
            display: flex;
            align-items: center;
        }

        .breadcrumb-item {
            cursor: pointer;
        }

        .breadcrumb-item:hover {
            color: var(--color-blue-500);
        }

        .breadcrumb-item:not(:last-child)::after {
            content: '/';
            margin: 0 8px;
            color: var(--color-gray-400);
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 0.125rem 0.5rem;
            border-radius: 9999px;
            font-size: 0.75rem;
            font-weight: 500;
        }

        .badge-blue {
            background-color: var(--color-blue-100);
            color: var(--color-blue-700);
        }

        /* Misc */
        .section-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1.5rem;
            border-bottom: 1px solid var(--color-gray-100);
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-weight: 500;
            color: var(--color-gray-900);
        }

        .section-content {
            padding: 1.5rem;
        }

        .action-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        .error-message {
            display: flex;
            align-items: center;
            gap: 0.25rem;
            color: var(--color-red-500);
            font-size: 0.875rem;
            background-color: var(--color-red-50);
            padding: 0.25rem 0.5rem;
            border-radius: 9999px;
        }

        .hidden {
            display: none;
        }

        .schema-section {
            margin-top: 1rem;
        }

        .schema-title {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--color-gray-700);
        }

        /* Loading spinner */
        .loading-spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Modal */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
            z-index: 50;
        }

        .modal-container {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background-color: var(--color-white);
            border-radius: 0.75rem;
            padding: 1.5rem;
            box-shadow: var(--shadow-lg);
            max-width: 28rem;
            width: 100%;
        }

        .modal-title {
            font-size: 1.125rem;
            font-weight: 600;
            margin-bottom: 1rem;
        }

        .shortcut-list {
            margin-bottom: 1rem;
        }

        .shortcut-item {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.5rem;
        }

        .keyboard-shortcut {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            background-color: var(--color-gray-100);
            border-radius: 0.25rem;
            font-family: monospace;
        }

        .modal-button {
            display: block;
            width: 100%;
            padding: 0.5rem 1rem;
            margin-top: 1rem;
            background-color: var(--color-blue-500);
            color: var(--color-white);
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
        }

        .modal-button:hover {
            background-color: var(--color-blue-600);
        }

        /* Hide scrollbar but keep functionality */
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Dark mode */
        body.dark {
            background: linear-gradient(to bottom right, var(--color-gray-900), var(--color-gray-800));
            color: var(--color-white);
        }

        body.dark .card {
            background-color: rgba(31, 41, 55, 0.8);
            border-color: var(--color-gray-700);
        }

        body.dark .header-description {
            color: var(--color-gray-400);
        }

        body.dark .input {
            background-color: rgba(17, 24, 39, 0.5);
            color: var(--color-white);
        }

        body.dark .search-input input {
            background-color: var(--color-gray-700);
            color: var(--color-white);
        }

        body.dark .field-list-container {
            background-color: rgba(17, 24, 39, 0.5);
        }

        body.dark .field-item:hover {
            background-color: var(--color-gray-800);
        }

        body.dark .field-item.selected {
            background-color: rgba(30, 58, 138, 0.5);
        }

        body.dark .field-item.selected:hover {
            background-color: rgba(30, 58, 138, 0.7);
        }

        body.dark .field-content {
            color: var(--color-gray-300);
        }

        body.dark .field-name {
            color: var(--color-gray-300);
        }

        body.dark .field-name.last {
            color: var(--color-blue-400);
        }

        body.dark .preview-content {
            background-color: rgba(17, 24, 39, 0.5);
        }

        body.dark .preview-label {
            background-color: rgba(31, 41, 55, 0.8);
            color: var(--color-gray-400);
        }

        body.dark .breadcrumbs {
            border-color: var(--color-gray-700);
            color: var(--color-gray-400);
        }

        body.dark .section-header {
            border-color: var(--color-gray-700);
        }

        body.dark .section-title {
            color: var(--color-white);
        }

        body.dark .divide-x > * + * {
            border-color: var(--color-gray-700);
        }

        body.dark .btn-default {
            background-color: var(--color-gray-700);
            color: var(--color-gray-300);
        }

        body.dark .btn-default:hover {
            background-color: var(--color-gray-600);
        }

        body.dark .btn-disabled {
            background-color: var(--color-gray-700);
            color: var(--color-gray-500);
        }

        body.dark .keyboard-shortcut {
            background-color: var(--color-gray-700);
            color: var(--color-gray-300);
        }

        body.dark .modal-container {
            background-color: var(--color-gray-800);
            color: var(--color-white);
        }

        body.dark .badge-blue {
            background-color: var(--color-blue-900);
            color: var(--color-blue-200);
        }
    </style>
</head>
<body>
    <div class="container space-y-6">
        <!-- Header with Theme Toggle -->
        <div class="card header-card">
            <button id="theme-toggle" class="btn btn-default" style="position: absolute; right: 1.5rem; top: 1.5rem; padding: 0.5rem;">
                <i icon-name="sun" style="width: 1.25rem; height: 1.25rem; margin: 0; display: none;"></i>
                <i icon-name="moon" style="width: 1.25rem; height: 1.25rem; margin: 0;"></i>
            </button>
            <h1 class="header">JSON Field Editor</h1>
            <p class="header-description">Modern JSON structure modification tool</p>
        </div>

        <!-- Keyboard Shortcuts Modal -->
        <div id="shortcuts-modal" class="hidden modal-backdrop">
            <div class="modal-container">
                <h3 class="modal-title">Keyboard Shortcuts</h3>
                <div class="shortcut-list">
                    <div class="shortcut-item">
                        <span>Copy JSON</span>
                        <span class="keyboard-shortcut">⌘ + C</span>
                    </div>
                    <div class="shortcut-item">
                        <span>Undo</span>
                        <span class="keyboard-shortcut">⌘ + Z</span>
                    </div>
                    <div class="shortcut-item">
                        <span>Search Fields</span>
                        <span class="keyboard-shortcut">⌘ + F</span>
                    </div>
                    <div class="shortcut-item">
                        <span>Toggle Dark Mode</span>
                        <span class="keyboard-shortcut">⌘ + D</span>
                    </div>
                </div>
                <button class="modal-button" onclick="document.getElementById('shortcuts-modal').classList.add('hidden')">
                    Close
                </button>
            </div>
        </div>

        <!-- Input Panel -->
        <div class="card input-card">
            <div class="action-bar">
                <div class="flex items-center space-x-2">
                    <i icon-name="code" style="width: 1.25rem; height: 1.25rem; color: var(--color-blue-500);"></i>
                    <span style="font-weight: 500; color: var(--color-gray-900);">Input JSON</span>
                </div>
                <div class="flex space-x-2">
                    <button id="format-button" class="btn btn-default">
                        <i icon-name="type"></i>
                        Format
                    </button>
                    <button id="validate-button" class="btn btn-default">
                        <i icon-name="check-circle"></i>
                        Validate
                    </button>
                </div>
                <div id="error-message" class="hidden error-message">
                    <i icon-name="x"></i>
                    <span></span>
                </div>
            </div>
            
            <textarea
                id="json-input"
                class="input"
                style="height: 12rem;"
                placeholder="Paste your JSON here..."
                spellcheck="false"
            >{"name": "John Doe","job": "QA Lead","details": {"location": "New York"}}</textarea>

            <!-- Schema Input -->
            <div class="hidden schema-section" id="schema-input-container">
                <div class="schema-title">
                    <i icon-name="file-json" style="width: 1rem; height: 1rem; color: var(--color-blue-500);"></i>
                    <span>JSON Schema (optional)</span>
                </div>
                <textarea
                    id="schema-input"
                    class="input"
                    style="height: 6rem;"
                    placeholder="Paste your JSON Schema here for validation..."
                    spellcheck="false"
                ></textarea>
            </div>
        </div>

        <!-- Fields and Preview Grid -->
        <div class="card main-card">
            <!-- Action Bar -->
            <div class="section-header">
                <div class="section-title">
                    <span>Fields & Preview</span>
                    <span id="fields-count" class="badge badge-blue">
                        0 fields
                    </span>
                </div>
                
                <div class="flex items-center space-x-4">
                    <!-- Search Input -->
                    <div class="search-input">
                        <input
                            type="text"
                            id="search-input"
                            placeholder="Search fields..."
                        />
                        <i icon-name="search"></i>
                    </div>

                    <div class="flex space-x-2">
                        <button
                            id="select-all-button"
                            class="btn btn-success"
                        >
                            <i icon-name="check-circle"></i>
                            Select All
                        </button>

                        <button
                            id="clear-all-button"
                            class="btn btn-danger"
                        >
                            <i icon-name="x-circle"></i>
                            Clear All
                        </button>

                        <button
                            id="shortcuts-button"
                            class="btn btn-default"
                        >
                            <i icon-name="keyboard"></i>
                            Shortcuts
                        </button>

                        <button
                            id="multi-select-button"
                            class="btn btn-default"
                        >
                            <i icon-name="layers"></i>
                            Multi-Select
                        </button>

                        <button
                            id="undo-button"
                            disabled
                            class="btn btn-disabled"
                        >
                            <i icon-name="rotate-ccw"></i>
                            Undo
                        </button>
                        
                        <button
                            id="copy-button"
                            disabled
                            class="btn btn-disabled"
                        >
                            <i icon-name="copy"></i>
                            <span>Copy JSON</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Breadcrumbs -->
            <div class="breadcrumbs" id="breadcrumbs">
                <i icon-name="folder" style="width: 1rem; height: 1rem;"></i>
                <div class="breadcrumb-items" id="breadcrumb-items">
                    <span class="breadcrumb-item">root</span>
                </div>
            </div>

            <!-- Two Column Layout -->
            <div class="grid grid-cols-2 divide-x">
                <!-- Fields List -->
                <div class="section-content">
                    <div class="field-list-container">
                        <div id="fields-list" class="field-list hide-scrollbar">
                            <!-- Fields will be inserted here -->
                        </div>
                    </div>
                </div>

                <!-- JSON Preview -->
                <div class="section-content">
                    <div class="preview-container">
                        <div class="preview-label">
                            <i icon-name="eye" style="width: 0.75rem; height: 0.75rem;"></i>
                            <span>Preview</span>
                        </div>
                        <div class="preview-content hide-scrollbar">
                            <pre id="json-preview" style="font-family: monospace; font-size: 0.875rem;"></pre>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // State management
        let parsedJson = null;
        let currentJson = null;
        let selectedKeys = new Set();
        let history = [];
        let copyTimeout = null;
        let currentPath = [];
        let isDarkMode = false;
        let isMultiSelectMode = false;
        let lastSelectedKey = null;
        let activeKeys = new Set();

        // DOM Elements
        const jsonInput = document.getElementById('json-input');
        const schemaInput = document.getElementById('schema-input');
        const errorMessage = document.getElementById('error-message');
        const fieldsCount = document.getElementById('fields-count');
        const fieldsList = document.getElementById('fields-list');
        const jsonPreview = document.getElementById('json-preview');
        const undoButton = document.getElementById('undo-button');
        const copyButton = document.getElementById('copy-button');
        const searchInput = document.getElementById('search-input');
        const formatButton = document.getElementById('format-button');
        const validateButton = document.getElementById('validate-button');
        const themeToggle = document.getElementById('theme-toggle');
        const shortcutsButton = document.getElementById('shortcuts-button');
        const breadcrumbItems = document.getElementById('breadcrumb-items');
        const multiSelectButton = document.getElementById('multi-select-button');

        // Initialize Sortable
        new Sortable(fieldsList, {
            animation: 150,
            ghostClass: 'bg-blue-50',
            onEnd: function(evt) {
                // Handle reordering if needed
                updateUI();
            }
        });

        // Show error message
        function showError(message) {
            errorMessage.classList.remove('hidden');
            errorMessage.querySelector('span').textContent = message;
        }

        // Hide error message
        function hideError() {
            errorMessage.classList.add('hidden');
        }

        // Get type of value with more specific information
        function getDetailedType(value) {
            if (value === null) return 'null';
            if (Array.isArray(value)) return 'array';
            return typeof value;
        }

        // Create type indicator element
        function createTypeIndicator(type) {
            const span = document.createElement('span');
            span.className = `type-indicator type-${type}`;
            span.textContent = type;
            return span;
        }

        // Extract all keys from an object
        function extractKeys(obj, prefix = '') {
            const keys = new Set();
            
            function traverse(obj, prefix = '') {
                Object.entries(obj).forEach(([key, value]) => {
                    const fullPath = prefix ? `${prefix}.${key}` : key;
                    keys.add(fullPath);
                    if (value && typeof value === 'object') {
                        traverse(value, fullPath);
                    }
                });
            }
            
            traverse(obj, prefix);
            return keys;
        }

        // Generate JSON based on selected fields
        function generateJsonFromKeys(baseJson, selectedKeys) {
            const newJson = {};
            
            function buildJson(obj, target, prefix = '') {
                Object.entries(obj).forEach(([key, value]) => {
                    const fullPath = prefix ? `${prefix}.${key}` : key;
                    
                    if (typeof value === 'object' && value !== null) {
                        const hasSelectedNestedFields = Array.from(selectedKeys).some(
                            selectedKey => selectedKey.startsWith(fullPath + '.')
                        );
                        
                        if (hasSelectedNestedFields || selectedKeys.has(fullPath)) {
                            target[key] = Array.isArray(value) ? [] : {};
                            buildJson(value, target[key], fullPath);
                        }
                    } else if (selectedKeys.has(fullPath)) {
                        target[key] = value;
                    }
                });
            }
            
            buildJson(baseJson, newJson);
            return newJson;
        }

        // Update breadcrumbs
        function updateBreadcrumbs() {
            breadcrumbItems.innerHTML = '';
            const paths = ['root', ...currentPath];
            
            paths.forEach((path, index) => {
                const span = document.createElement('span');
                span.className = 'breadcrumb-item';
                span.textContent = path;
                span.onclick = () => {
                    currentPath = paths.slice(1, index);
                    updateUI();
                };
                breadcrumbItems.appendChild(span);
            });
        }

        // Create field element
        function createFieldElement(key) {
            const div = document.createElement('div');
            const isSelected = selectedKeys.has(key);
            
            div.className = isSelected ? 'field-item selected' : 'field-item';
            
            const keyParts = key.split('.');
            const keyContent = document.createElement('div');
            keyContent.className = 'field-content';

            // Selection indicator
            const checkbox = document.createElement('div');
            checkbox.className = 'field-checkbox';
            if (isSelected) {
                checkbox.innerHTML = '<i icon-name="check" style="width: 0.75rem; height: 0.75rem; color: white;"></i>';
            }
            keyContent.appendChild(checkbox);

            keyParts.forEach((part, i) => {
                if (i > 0) {
                    const chevron = document.createElement('i');
                    chevron.setAttribute('icon-name', 'chevron-right');
                    chevron.className = 'field-chevron';
                    keyContent.appendChild(chevron);
                }
                
                const span = document.createElement('span');
                span.className = i === keyParts.length - 1 ? 'field-name last' : 'field-name';
                span.textContent = part;
                keyContent.appendChild(span);
            });

            // Add type indicator
            const value = key.split('.').reduce((obj, key) => obj[key], parsedJson);
            const type = getDetailedType(value);
            keyContent.appendChild(createTypeIndicator(type));

            div.appendChild(keyContent);
            div.onclick = (e) => toggleFieldSelection(key, e);

            return div;
        }

        // Toggle field selection
        function toggleFieldSelection(key, event) {
            const newSelection = new Set(selectedKeys);
            const keyParts = key.split('.');
            const isParentKey = Array.from(selectedKeys).some(k => k.startsWith(key + '.'));
            const parentKey = keyParts.slice(0, -1).join('.');
            
            if (!isMultiSelectMode && !event.shiftKey) {
                // Single select mode
                if (selectedKeys.has(key)) {
                    // Deselect the key and its children
                    Array.from(selectedKeys).forEach(k => {
                        if (k === key || k.startsWith(key + '.')) {
                            newSelection.delete(k);
                        }
                    });
                } else {
                    // Select the key, its children, and its parent chain
                    newSelection.add(key);
                    // Select all children
                    Array.from(extractKeys(parsedJson)).forEach(k => {
                        if (k.startsWith(key + '.')) {
                            newSelection.add(k);
                        }
                    });
                    // Select parent chain
                    let currentParent = parentKey;
                    while (currentParent) {
                        newSelection.add(currentParent);
                        currentParent = currentParent.split('.').slice(0, -1).join('.');
                    }
                }
            } else {
                // Multi-select mode
                if (event.shiftKey && lastSelectedKey) {
                    // Range select
                    const allKeys = Array.from(extractKeys(parsedJson)).sort();
                    const startIdx = allKeys.indexOf(lastSelectedKey);
                    const endIdx = allKeys.indexOf(key);
                    const [minIdx, maxIdx] = [Math.min(startIdx, endIdx), Math.max(startIdx, endIdx)];
                    
                    allKeys.slice(minIdx, maxIdx + 1).forEach(k => newSelection.add(k));
                } else {
                    // Toggle single key and its dependencies
                    if (selectedKeys.has(key)) {
                        newSelection.delete(key);
                    } else {
                        newSelection.add(key);
                        // Select parent chain
                        let currentParent = parentKey;
                        while (currentParent) {
                            newSelection.add(currentParent);
                            currentParent = currentParent.split('.').slice(0, -1).join('.');
                        }
                    }
                }
            }
            
            lastSelectedKey = key;
            selectedKeys = newSelection;
            updateJsonPreview();
            updateUI();
        }

        // Update JSON preview based on selection
        function updateJsonPreview() {
            if (selectedKeys.size === 0) {
                currentJson = {};
            } else {
                currentJson = generateJsonFromKeys(parsedJson, selectedKeys);
            }
        }

        // Update UI elements
        function updateUI() {
            // Update fields count
            fieldsCount.textContent = `${activeKeys.size} fields`;
            
            // Update fields list
            fieldsList.innerHTML = '';
            Array.from(activeKeys)
                .sort()
                .filter(key => {
                    const search = searchInput.value.toLowerCase();
                    return !search || key.toLowerCase().includes(search);
                })
                .forEach(key => {
                    fieldsList.appendChild(createFieldElement(key));
                });
            
            // Update JSON preview with syntax highlighting
            if (currentJson) {
                const formatted = JSON.stringify(currentJson, null, 2);
                jsonPreview.innerHTML = hljs.highlight(formatted, {language: 'json'}).value;
            } else {
                jsonPreview.textContent = '';
            }
            
            // Update breadcrumbs
            updateBreadcrumbs();
            
            // Update button states
            undoButton.disabled = history.length <= 1;
            undoButton.className = history.length <= 1 ? 'btn btn-disabled' : 'btn btn-default';
            
            copyButton.disabled = !currentJson || Object.keys(currentJson).length === 0;
            copyButton.className = (!currentJson || Object.keys(currentJson).length === 0) ? 'btn btn-disabled' : 'btn btn-primary';

            // Refresh icons
            lucide.createIcons();
        }

        // Format JSON
        function formatJson() {
            try {
                const input = jsonInput.value.trim();
                if (input) {
                    const formatted = JSON.stringify(JSON.parse(input), null, 2);
                    jsonInput.value = formatted;
                    hideError();
                }
            } catch (err) {
                showError('Invalid JSON');
            }
        }

        // Validate JSON against schema
        function validateJson() {
            try {
                const schemaText = schemaInput.value.trim();
                if (!schemaText) {
                    showError('Please provide a JSON Schema');
                    return;
                }

                const schema = JSON.parse(schemaText);
                const ajv = new Ajv();
                const validate = ajv.compile(schema);
                const valid = validate(parsedJson);

                if (!valid) {
                    showError(`Validation Error: ${validate.errors[0].message}`);
                } else {
                    showError('JSON is valid');
                    setTimeout(hideError, 2000);
                }
            } catch (err) {
                showError('Invalid JSON Schema');
            }
        }

        // Toggle dark mode
        function toggleDarkMode() {
            isDarkMode = !isDarkMode;
            document.body.classList.toggle('dark');

            // Update sun/moon icons
            const sunIcon = themeToggle.querySelector('[icon-name="sun"]');
            const moonIcon = themeToggle.querySelector('[icon-name="moon"]');
            
            if (isDarkMode) {
                sunIcon.style.display = 'inline';
                moonIcon.style.display = 'none';
            } else {
                sunIcon.style.display = 'none';
                moonIcon.style.display = 'inline';
            }
            
            updateUI();
        }

        // Event Listeners
        jsonInput.addEventListener('input', (e) => {
            try {
                const input = e.target.value.trim();
                if (input) {
                    parsedJson = JSON.parse(input);
                    currentJson = parsedJson;
                    activeKeys = extractKeys(parsedJson);
                    history = [{ json: parsedJson, keys: new Set(activeKeys) }];
                    hideError();
                } else {
                    parsedJson = null;
                    currentJson = null;
                    activeKeys = new Set();
                    history = [];
                }
                updateUI();
            } catch (err) {
                showError('Please enter valid JSON');
                parsedJson = null;
                currentJson = null;
                activeKeys = new Set();
                history = [];
                updateUI();
            }
        });

        searchInput.addEventListener('input', updateUI);
        formatButton.addEventListener('click', formatJson);
        validateButton.addEventListener('click', validateJson);
        themeToggle.addEventListener('click', toggleDarkMode);
        shortcutsButton.addEventListener('click', () => {
            document.getElementById('shortcuts-modal').classList.remove('hidden');
        });

        // Handle field removal
        function removeKey(keyPath) {
            const newKeys = new Set(activeKeys);
            
            // Remove the key and all its children
            Array.from(activeKeys).forEach(key => {
                if (key === keyPath || key.startsWith(keyPath + '.')) {
                    newKeys.delete(key);
                }
            });
            
            // Check for and remove empty parent objects
            const allRemainingKeys = Array.from(newKeys);
            const keysToRemove = new Set();
            
            allRemainingKeys.forEach(key => {
                const parts = key.split('.');
                if (parts.length > 1) {
                    const parentPath = parts.slice(0, -1).join('.');
                    const siblings = allRemainingKeys.filter(k => 
                        k !== key && 
                        k.startsWith(parentPath + '.') && 
                        !k.slice(parentPath.length + 1).includes('.')
                    );
                    
                    if (siblings.length === 0) {
                        // No siblings found, check if parent is an empty object
                        const parentValue = parentPath.split('.').reduce((obj, key) => obj?.[key], parsedJson);
                        if (typeof parentValue === 'object' && !Array.isArray(parentValue)) {
                            keysToRemove.add(parentPath);
                        }
                    }
                }
            });
            
            // Remove empty parent objects
            keysToRemove.forEach(key => {
                newKeys.delete(key);
            });
            
            const newJson = generateJsonFromKeys(parsedJson, newKeys);
            
            activeKeys = newKeys;
            currentJson = newJson;
            history.push({ json: newJson, keys: new Set(newKeys) });
            
            updateUI();
        }

        // Handle undo
        undoButton.addEventListener('click', () => {
            if (history.length > 1) {
                history.pop();
                const previousState = history[history.length - 1];
                
                currentJson = previousState.json;
                activeKeys = new Set(previousState.keys);
                
                updateUI();
            }
        });

        // Handle copy to clipboard
        copyButton.addEventListener('click', async () => {
            if (!currentJson) return;
            
            try {
                await navigator.clipboard.writeText(JSON.stringify(currentJson, null, 2));
                
                const originalContent = copyButton.innerHTML;
                copyButton.innerHTML = `
                    <i icon-name="check"></i>
                    <span>Copied!</span>
                `;
                copyButton.className = 'btn btn-success';
                lucide.createIcons();
                
                if (copyTimeout) clearTimeout(copyTimeout);
                
                copyTimeout = setTimeout(() => {
                    copyButton.innerHTML = originalContent;
                    copyButton.className = 'btn btn-primary';
                    lucide.createIcons();
                }, 2000);
            } catch (err) {
                console.error('Failed to copy:', err);
                showError('Failed to copy to clipboard');
            }
        });

        // Toggle multi-select mode
        multiSelectButton.addEventListener('click', (e) => {
            isMultiSelectMode = !isMultiSelectMode;
            
            if (isMultiSelectMode) {
                multiSelectButton.className = 'btn btn-primary';
            } else {
                multiSelectButton.className = 'btn btn-default';
            }
        });

        // Button Handlers
        document.getElementById('select-all-button').addEventListener('click', () => {
            selectedKeys = extractKeys(parsedJson);
            updateJsonPreview();
            updateUI();
        });

        document.getElementById('clear-all-button').addEventListener('click', () => {
            selectedKeys.clear();
            updateJsonPreview();
            updateUI();
        });

        // Show schema input on validate button click
        validateButton.addEventListener('click', () => {
            document.getElementById('schema-input-container').classList.remove('hidden');
        });

        // Trigger initial load of default JSON
        window.addEventListener('load', () => {
            jsonInput.dispatchEvent(new Event('input'));
        });
    </script>
</body>
</html>
